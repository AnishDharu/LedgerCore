<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${projectName}">LedgerCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-5">
                    <p class="text-uppercase text-primary fw-semibold small mb-2">Project initialized</p>
                    <h1 class="display-5 fw-bold" th:text="${projectName}">LedgerCore</h1>
                    <p class="lead text-secondary" th:text="${message}">
                        Your banking-inspired platform is ready to build.
                    </p>
                    <hr class="my-4">
                    <p class="mb-0">Next: configure PostgreSQL, then build accounts and the transaction ledger.</p>
                    <p class="text-secondary small mt-3 mb-0">
                        Learning / portfolio simulation only — not connected to real funds.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
