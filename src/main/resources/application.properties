spring.application.name=ledgercore

server.port=8080

# PostgreSQL connection
spring.datasource.url=${LEDGERCORE_DB_URL:jdbc:postgresql://localhost:5432/ledgercore_db}
spring.datasource.username=${LEDGERCORE_DB_USERNAME:ledgercore_app}
spring.datasource.password=${LEDGERCORE_DB_PASSWORD}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
# Default provided for local development; in production set LEDGERCORE_JWT_SECRET environment variable
ledgercore.jwt.secret=${LEDGERCORE_JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
ledgercore.jwt.expiration-ms=${LEDGERCORE_JWT_EXPIRATION_MS:86400000}

# Default Admin Bootstrap Configuration
# Password and email can be overridden via environment variables
ledgercore.admin.email=${LEDGERCORE_ADMIN_EMAIL:admin@ledgercore.com}
ledgercore.admin.password=${LEDGERCORE_ADMIN_PASSWORD:Admin@123}
